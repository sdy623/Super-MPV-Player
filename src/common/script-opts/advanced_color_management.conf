# User-accepted 50e88c0 colour order. It is eligible only for a Dolby Vision
# source on an output Windows positively identifies as SDR-only; every other
# source/output combination remains ordinary gpu-next auto negotiation.
start_mode=display-auto
advanced_reference=50e88c0

# auto: user override first, then current ICC/ICM lumi, DisplayID/EDID and DXGI.
# A numeric value is for a colorimeter/DisplayCAL result for this display mode.
advanced_peak=auto

# Sustained full-frame white. auto reads DXGI MaxFullFrameLuminance first, then
# DisplayID. It remains separate from a measured small-window peak.
advanced_full_frame=auto

# auto keeps the OEM/ICC physical black in diagnostics, then uses the darker
# credible floor from that value and the active SDR swapchain. This prevents an
# encoded black lift without imposing a fixed contrast. A measured cd/m2 value
# from DisplayCAL/colorimeter overrides both inputs.
advanced_black=auto

# Advanced DV to SDR exposes four independent gpu-next gamut strategies:
# perceptual, relative, desaturate and darken. Perceptual is the measured
# closest default; the other three remain available for source-specific checks.
advanced_mapping=perceptual

# Keep the accepted full-size staged P8.4 colour path at every resolution.
# P5/P7/P8.1/P9/P10 use the dynamic 32x18 probe path regardless of this switch.
# Use no only for a deliberate P8.4 performance comparison.
advanced_staged=yes

# Optional scene- and display-aware highlight shoulder. Off by default.
# Runs only in Advanced DV to SDR with the direct BT.709/sRGB path (no player
# ICC, target LUT or conflicting output hook). It is not a calibration LUT.
advanced_adaptive_highlights=no

# auto derives the content-mapping anchor from the active output's full-frame
# luminance. A numeric value is an expert override, not a universal preset.
advanced_signal_anchor=auto

# none preserves the accepted direct BT.709/sRGB reference. system-icc is the
# ordinary-user path and applies the Windows-installed display profile once.
# displaycal-lut is the expert path: set advanced_lut to a measured .cube file;
# system ICC remains disabled so the two device transforms never stack.
advanced_calibration=none
advanced_lut=

# Optional per-monitor measurements. Key entries by Windows monitor id so a
# measured peak or DisplayCAL LUT never leaks to another connected display.
advanced_profile_file=script-opts/advanced_display_profiles.json
