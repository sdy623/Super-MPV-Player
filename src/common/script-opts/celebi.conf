# ======用户设置自动保存的配置属性======
# ======下次启动会根据用户设置加载======

# 音量
volume=yes
# 视频帧同步模式
video-sync=no
# 自动加载icc配置文件
icc-profile-auto=no
# 色彩调整
contrast=no
# 亮度
brightness=no
# 伽马
gamma=no
# 饱和度
saturation=no
# 色调
hue=no
# 自动适应窗口大小
autofit=no
# 界面消息字体大小
osd-font-size=no
# 界面消息对齐方式
osd-align-x=no
# osd 界面等级
osd-level=no
# 字幕位置
sub-pos=no
# 次字幕位置
secondary-sub-pos=no
# 字幕缩放
sub-scale=no