name: Open edition source checks
on:
  push:
    branches: [open-edition]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/release_gate.py . --tracked
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/test_dependencies.lua windows/native-dv/dependency-policy.lua
      - run: luajit tests/test_native_controls.lua windows/native-dv/native-controls.lua
