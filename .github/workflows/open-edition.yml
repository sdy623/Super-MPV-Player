name: Open edition source checks
on:
  push:
    branches: [open-edition]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/release_gate.py . --tracked
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/test_dependencies.lua windows/native-dv/dependency-policy.lua
      - run: luajit tests/test_native_controls.lua windows/native-dv/native-controls.lua
      - run: luajit tests/test_external_omniphony.lua src/common/scripts/omniphony.lua
      - run: luajit tests/test_windows_sdr_color.lua src/common/scripts/hdr-controls.lua
      - run: luajit tests/test_relative_color.lua src/common/scripts/hdr-controls.lua
      - run: luajit tests/test_relative_color_stability.lua src/common/scripts/hdr-controls.lua
      - run: luajit tests/test_p5_icm.lua src/common/scripts/hdr-controls.lua
      - run: luajit tests/test_advanced_color.lua src/common/scripts/hdr-controls.lua
      - run: TEST_ADAPTIVE_OPT_IN=yes luajit tests/test_advanced_color.lua src/common/scripts/hdr-controls.lua
      - run: cc -std=c11 -Wall -Wextra -Werror -Icore/mpv/video/out tests/test_adaptive_dv_sdr.c -lm -o /tmp/test-adaptive-dv-sdr && /tmp/test-adaptive-dv-sdr
      - run: luajit tests/test_dv_playback.lua src/common/scripts/dv-playback.lua
      - run: luajit tests/test_dv_thumbnail.lua src/common/script-modules/dv-thumbnail.lua
      - run: luajit tests/test_stats_dv.lua src/common/scripts/stats.lua
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build
